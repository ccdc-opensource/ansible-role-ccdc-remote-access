---
- name: Install rustdesk
  community.general.homebrew:
    name: rustdesk
    state: present

- name: Allow rustdesk permissions
  ansible.builtin.copy:
    src: files/rustdesk-permissions.sh
    dest: /tmp/rustdesk-permissions.sh
    owner: "{{ ansible_user }}"
    group: wheel
    mode: "0755"
  become: true

- name: Run RustDesk permissions script
  ansible.builtin.command: /tmp/rustdesk-permissions.sh
  become: true

- name: Copy RustDesk service script
  ansible.builtin.copy:
    src: files/rustdesk-plist.sh
    dest: /tmp/rustdesk-plist.sh
    owner: "{{ ansible_user }}"
    group: wheel
    mode: "0755"
  become: true

- name: Run RustDesk service script
  ansible.builtin.command:
    argv:
      - /tmp/rustdesk-plist.sh
      - --app-path
      - /Applications/RustDesk.app
      - --target-user
      - "{{ ansible_user }}"
  become: true
